# PostgreSQL cho môi trường dev. Mật khẩu đặt trong file .env (không commit – xem .env.example).
#   docker compose up -d --wait
services:
  postgres:
    image: postgres:16-alpine
    container_name: schoolfund-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-schoolfund}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?Đặt MIGRATOR_DB_PASSWORD trong .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Đặt APP_DB_PASSWORD trong .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - schoolfund-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  schoolfund-pgdata:
